name: Create GitHub Release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js for generate package-lock.json
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate temporary package-lock.json
        run: |
          npm install
          rm -rf node_modules

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Docker images (tag + latest)
        run: |
          DOCKER_TAG="${GITHUB_REF_NAME}"
          docker buildx build \
            --push \
            --tag wxtewx/dockhand:${DOCKER_TAG} \
            --tag wxtewx/dockhand:latest \
            .

      - name: Extract changelog
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BODY=$(jq -r --arg v "$VERSION" '
            .[] | select(.version == $v) |
            "## v\(.version) 更新内容\n\n" +
            ([.changes[] |
              if .type == "feature" then "- ✨ \(.text)"
              elif .type == "fix" then "- 🐛 \(.text)"
              elif .type == "improvement" then "- ⚡ \(.text)"
              else "- \(.text)"
              end
            ] | join("\n")) +
            "\n"
          ' src/lib/data/changelog.json)
          if [ -z "$BODY" ]; then
            BODY="版本 ${GITHUB_REF_NAME}"
          fi
          cat <<EOF > /tmp/release-body.md
          ${BODY}
          ## Docker 镜像
          \`\`\`bash
          docker pull wxtewx/dockhand:${GITHUB_REF_NAME}
          \`\`\`
          同时提供标签 \`wxtewx/dockhand:latest\`
          [在 Docker Hub 查看](https://hub.docker.com/r/wxtewx/dockhand)
          EOF
          sed -i 's/^          //' /tmp/release-body.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body_path: /tmp/release-body.md
          generate_release_notes: false
